spring.application.name=Siball

spring.datasource.url=jdbc:mariadb://localhost:3306/siball
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.hbm2ddl.auto=none

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Autenticacion stateless mediante token Bearer firmado. En produccion, definir
# SIBALL_JWT_SECRET con un secreto aleatorio largo y cambiar las credenciales admin.
siball.security.jwt-secret=${SIBALL_JWT_SECRET:change-this-development-secret-to-a-long-random-value-before-production-2026}
siball.security.token-ttl-seconds=${SIBALL_TOKEN_TTL_SECONDS:14400}
siball.security.admin.email=${SIBALL_ADMIN_EMAIL:admin@epiis.com}
siball.security.admin.password=${SIBALL_ADMIN_PASSWORD:Admin12345}
