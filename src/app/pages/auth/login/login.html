<app-header />

<main class="auth-page">
  <section class="auth-card">
    <span class="auth-eyebrow">SIBALL HOTEL · ABANCAY</span>

    <h1>Bienvenido de nuevo</h1>

    <p class="auth-intro">
      Inicia sesión para continuar con tu reserva
      y consultar tus estadías.
    </p>

    @if (error) {
      <div class="auth-alert" role="alert">
        {{ error }}
      </div>
    }

    <form (ngSubmit)="iniciarSesion()" #formLogin="ngForm">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        name="correo"
        type="email"
        [(ngModel)]="correo"
        autocomplete="email"
        required
        email
        maxlength="150"
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
        maxlength="72"
      />

      <button
        class="auth-submit"
        type="submit"
        [disabled]="formLogin.invalid || cargando"
      >
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-switch">
      ¿Todavía no tienes cuenta?
      <a
        routerLink="/registro"
        [queryParams]="{ returnUrl: routeReturnUrl }"
      >
        Crear cuenta
      </a>
    </p>
  </section>
</main>

<app-footer />
