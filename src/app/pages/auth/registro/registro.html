<app-header />

<main class="auth-page">
  <section class="auth-card auth-card-wide">
    <span class="auth-eyebrow">ÚNETE A SIBALL HOTEL</span>

    <h1>Crea tu cuenta</h1>

    <p class="auth-intro">
      Regístrate para reservar habitaciones
      y administrar tus estadías.
    </p>

    @if (error) {
      <div class="auth-alert" role="alert">
        {{ error }}
      </div>
    }

    <form
      class="auth-grid-form"
      (ngSubmit)="registrar()"
      #formRegistro="ngForm"
    >
      <div class="auth-field">
        <label for="tipoDocumento">Tipo de documento</label>
        <select
          id="tipoDocumento"
          name="tipoDocumento"
          [(ngModel)]="tipoDocumento"
          required
        >
          <option value="dni">DNI</option>
          <option value="pasaporte">Pasaporte</option>
          <option value="carnet_extranjeria">
            Carné de extranjería
          </option>
        </select>
      </div>

      <div class="auth-field">
        <label for="numeroDocumento">Número de documento</label>
        <input
          id="numeroDocumento"
          name="numeroDocumento"
          [(ngModel)]="numeroDocumento"
          required
          maxlength="30"
        />
      </div>

      <div class="auth-field">
        <label for="nombres">Nombres</label>
        <input
          id="nombres"
          name="nombres"
          [(ngModel)]="nombres"
          autocomplete="given-name"
          required
          maxlength="100"
        />
      </div>

      <div class="auth-field">
        <label for="apellidos">Apellidos</label>
        <input
          id="apellidos"
          name="apellidos"
          [(ngModel)]="apellidos"
          autocomplete="family-name"
          required
          maxlength="100"
        />
      </div>

      <div class="auth-field">
        <label for="telefono">Teléfono (opcional)</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          [(ngModel)]="telefono"
          autocomplete="tel"
          maxlength="20"
        />
      </div>

      <div class="auth-field">
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="correo"
          autocomplete="email"
          required
          email
          maxlength="150"
        />
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          required
          minlength="8"
          maxlength="72"
        />
        <small>Usa al menos 8 caracteres.</small>
      </div>

      <div class="auth-field">
        <label for="confirmarPassword">
          Confirmar contraseña
        </label>
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          type="password"
          [(ngModel)]="confirmarPassword"
          autocomplete="new-password"
          required
          minlength="8"
          maxlength="72"
        />
      </div>

      <button
        class="auth-submit auth-submit-full"
        type="submit"
        [disabled]="formRegistro.invalid || cargando"
      >
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-switch">
      ¿Ya tienes cuenta?
      <a
        routerLink="/login"
        [queryParams]="{ returnUrl: routeReturnUrl }"
      >
        Inicia sesión
      </a>
    </p>
  </section>
</main>

<app-footer />
